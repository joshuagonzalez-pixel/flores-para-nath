<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Nath 💛 - Ramo de Flores Amarillas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #FFD700;
            --glow-yellow: #ffea00;
            --text-shadow: #f9a826;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #05000d 0%, #17042b 30%, #4a2171 70%, #d8685b 100%);
            font-family: 'Montserrat', sans-serif;
        }

        /* Contenedor de las estrellas CSS */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2) rotate(45deg); box-shadow: 0 0 5px white; }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* Canvas para los pétalos cayendo */
        #petals-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor principal de contenido */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Permite clicks a través del contenedor si fuera necesario */
        }

        .text-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.5rem, 10vw, 6.5rem);
            margin: 0;
            color: var(--primary-yellow);
            text-shadow: 0 0 15px var(--text-shadow), 0 0 30px var(--text-shadow);
            animation: glow 2s ease-in-out infinite alternate, floatDown 2s ease-out forwards;
            opacity: 0;
        }

        p {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-top: 15px;
            font-weight: 300;
            line-height: 1.4;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: fadeIn 3s forwards 1s;
            max-width: 600px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--text-shadow), 0 0 20px var(--text-shadow); }
            to { text-shadow: 0 0 20px var(--glow-yellow), 0 0 30px var(--glow-yellow), 0 0 50px var(--glow-yellow); }
        }

        @keyframes floatDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .bouquet-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            opacity: 0;
            animation: popIn 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.5s, swayBouquet 6s ease-in-out infinite alternate 3.5s;
            transform-origin: bottom center;
        }

        .bouquet-section svg {
            width: 100%;
            height: auto;
            max-height: 55vh;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(50px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes swayBouquet {
            0% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
            100% { transform: rotate(-4deg); }
        }

    </style>
</head>
<body>

    <!-- Fondo de estrellas -->
    <div id="stars-container"></div>

    <!-- Canvas de pétalos cayendo -->
    <canvas id="petals-canvas"></canvas>

    <!-- Contenido Principal -->
    <div class="main-content">
        <div class="text-section">
            <h1>Para Nath</h1>
            <p>Para la persona que hace mis días más brillantes 💛✨</p>
        </div>

        <div class="bouquet-section">
            <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Definición de una flor individual (Girasol/Margarita Amarilla) -->
                    <g id="flower">
                        <!-- Pétalos traseros -->
                        <g fill="#FFD700" stroke="#FFA500" stroke-width="1">
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(20)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(50)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(80)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(110)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(140)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(170)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(200)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(230)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(260)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(290)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(320)" />
                            <ellipse cx="0" cy="-30" rx="6" ry="30" transform="rotate(350)" />
                        </g>
                        <!-- Pétalos delanteros (más brillantes) -->
                        <g fill="#FFEA00">
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(5)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(35)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(65)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(95)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(125)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(155)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(185)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(215)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(245)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(275)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(305)" />
                            <ellipse cx="0" cy="-25" rx="5" ry="25" transform="rotate(335)" />
                        </g>
                        <!-- Centro de la flor -->
                        <circle cx="0" cy="0" r="16" fill="#5C4033" />
                        <circle cx="0" cy="0" r="12" fill="#3E2723" />
                        <!-- Puntitos del polen -->
                        <circle cx="-5" cy="-5" r="1.5" fill="#8D6E63" />
                        <circle cx="5" cy="5" r="1.5" fill="#8D6E63" />
                        <circle cx="6" cy="-4" r="1.5" fill="#8D6E63" />
                        <circle cx="-4" cy="6" r="1.5" fill="#8D6E63" />
                        <circle cx="0" cy="0" r="2" fill="#A1887F" />
                    </g>

                    <!-- Definición de una hoja verde -->
                    <g id="leaf">
                        <path d="M0,0 C-15,-20 -20,-40 0,-60 C20,-40 15,-20 0,0" fill="#2E7D32" />
                        <line x1="0" y1="0" x2="0" y2="-55" stroke="#1B5E20" stroke-width="2" />
                    </g>
                </defs>

                <!-- Tallos inferiores (debajo del papel) -->
                <path d="M190,400 L170,480 M200,400 L195,485 M210,400 L220,480" stroke="#388E3C" stroke-width="6" fill="none" stroke-linecap="round"/>
                
                <!-- Papel de envoltorio trasero (kraft oscuro) -->
                <path d="M80,180 L320,180 L230,420 L170,420 Z" fill="#A67B5B" />
                <path d="M70,140 Q200,190 330,140 L320,180 L80,180 Z" fill="#C19A6B" />

                <!-- Grupo de Hojas de fondo -->
                <use href="#leaf" x="120" y="160" transform="rotate(-30 120 160) scale(1.2)" />
                <use href="#leaf" x="280" y="160" transform="rotate(30 280 160) scale(1.2)" />
                <use href="#leaf" x="160" y="130" transform="rotate(-15 160 130)" />
                <use href="#leaf" x="240" y="130" transform="rotate(15 240 130)" />
                <use href="#leaf" x="200" y="100" />

                <!-- Flores del ramo (Arreglo floral) -->
                <!-- Capa trasera -->
                <use href="#flower" x="140" y="170" transform="scale(0.9)" />
                <use href="#flower" x="260" y="170" transform="scale(0.9)" />
                <use href="#flower" x="170" y="120" transform="scale(0.85)" />
                <use href="#flower" x="230" y="120" transform="scale(0.85)" />
                <use href="#flower" x="200" y="90" transform="scale(0.9)" />

                <!-- Capa media -->
                <use href="#flower" x="110" y="210" transform="scale(1)" />
                <use href="#flower" x="290" y="210" transform="scale(1)" />
                <use href="#flower" x="160" y="180" transform="scale(1.05)" />
                <use href="#flower" x="240" y="180" transform="scale(1.05)" />
                
                <!-- Capa frontal (La más grande en el centro) -->
                <use href="#flower" x="200" y="150" transform="scale(1.15)" />
                <use href="#flower" x="200" y="210" transform="scale(1.1)" />

                <!-- Papel de envoltorio frontal (solapas) -->
                <path d="M80,180 L140,280 L170,420 L230,420 L260,280 L320,180 C280,240 220,280 200,280 C180,280 120,240 80,180 Z" fill="#D2B48C" />
                <path d="M140,280 L200,420 L170,420 Z" fill="#C19A6B" opacity="0.6"/> <!-- Sombra del doblez -->

                <!-- Lazo decorativo (Rosa / Rojo elegante) -->
                <g transform="translate(0, 50)">
                    <path d="M160,280 Q120,250 140,310 Q180,310 200,290 Z" fill="#d81b60" /> <!-- Oreja izquierda -->
                    <path d="M240,280 Q280,250 260,310 Q220,310 200,290 Z" fill="#d81b60" /> <!-- Oreja derecha -->
                    <!-- Cintas colgando -->
                    <path d="M190,290 Q170,350 150,380" stroke="#d81b60" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <path d="M210,290 Q230,360 250,390" stroke="#d81b60" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <circle cx="200" cy="290" r="10" fill="#ad1457" /> <!-- Nudo del lazo -->
                </g>
            </svg>
        </div>
    </div>

    <script>
        // --- 1. ESTRELLAS DE FONDO CSS ---
        const starsContainer = document.getElementById('stars-container');
        const numStars = window.innerWidth < 600 ? 50 : 120; // Menos estrellas en móvil
        
        for (let i = 0; i < numStars; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            
            // Posición y tamaño aleatorio
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            let size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // Retraso de animación para que parpadeen asíncronamente
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.animationDuration = `${2 + Math.random() * 3}s`;
            
            starsContainer.appendChild(star);
        }

        // --- 2. PÉTALOS DE CANVAS ---
        const canvas = document.getElementById('petals-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const petals = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numPetals = window.innerWidth < 600 ? 25 : 50;

        for (let i = 0; i < numPetals; i++) {
            petals.push({
                x: Math.random() * width,
                y: Math.random() * height - height, 
                w: 8 + Math.random() * 8, // Ancho del pétalo
                h: 15 + Math.random() * 10, // Largo del pétalo
                speedY: 1 + Math.random() * 1.5, // Velocidad de caída
                speedX: -1 + Math.random() * 2, // Movimiento lateral (viento)
                angle: Math.random() * 360, // Rotación actual
                spin: -0.05 + Math.random() * 0.1, // Velocidad de rotación
                color: `rgba(255, ${200 + Math.random() * 40}, 0, ${0.6 + Math.random() * 0.4})`
            });
        }

        function drawPetal(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.beginPath();
            
            // Dibujando el pétalo con curvas Bezier para que se vea orgánico
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(p.w, p.h / 3, p.w, (p.h / 3) * 2, 0, p.h);
            ctx.bezierCurveTo(-p.w, (p.h / 3) * 2, -p.w, p.h / 3, 0, 0);
            
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        }

        function animatePetals() {
            ctx.clearRect(0, 0, width, height);

            petals.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += p.spin;

                // Si el pétalo sale por debajo, reaparece arriba
                if (p.y > height + 20) {
                    p.y = -20;
                    p.x = Math.random() * width;
                }
                // Si el pétalo sale por un lado, reaparece por el otro
                if (p.x > width + 20) p.x = -20;
                if (p.x < -20) p.x = width + 20;

                drawPetal(p);
            });

            requestAnimationFrame(animatePetals);
        }

        // Iniciar la animación al cargar la página
        window.onload = () => {
            animatePetals();
        };
    </script>
</body>
</html>
